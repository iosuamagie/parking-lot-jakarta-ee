plugins {
    id 'java'
    id 'war'
}

group 'org.parkinglot'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
    testcontainersVersion = '2.0.5'
}

sourceCompatibility = '21'
targetCompatibility = '21'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Integration tests live in src/integrationTest: they start the real app in Docker and talk to it over HTTP
sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    compileOnly('jakarta.platform:jakarta.jakartaee-api:10.0.0')
    compileOnly('org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1')
    // Payara has MicroProfile OpenAPI built in; the annotations only describe the API at /openapi
    compileOnly('org.eclipse.microprofile.openapi:microprofile-openapi-api:4.0.2')
    // Shipped inside the WAR, so the server needs no driver setup
    implementation('org.postgresql:postgresql:42.7.14')
    // QR codes for the parking tickets
    implementation('com.google.zxing:core:3.5.4')
    // PDF receipts and reports; the extra fonts have the Romanian letters (ă, ș, ț)
    implementation('com.github.librepdf:openpdf:3.0.5')
    implementation('com.github.librepdf:openpdf-fonts-extra:3.0.5')
    // Swagger UI files, served from the WAR at /webjars/swagger-ui/5.33.2/
    implementation('org.webjars:swagger-ui:5.33.2')

    // The server provides the Jakarta EE classes at runtime; the tests need them on their own classpath
    testImplementation('jakarta.platform:jakarta.jakartaee-api:10.0.0')
    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")

    integrationTestImplementation("org.testcontainers:testcontainers:${testcontainersVersion}")
    integrationTestImplementation("org.testcontainers:testcontainers-postgresql:${testcontainersVersion}")
}

test {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    description = 'Starts Payara and PostgreSQL in Docker with the built WAR and tests the app over HTTP.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    dependsOn tasks.named('war')
    // A new WAR means the tests must run again, even when the test code did not change
    inputs.file(tasks.named('war').flatMap { it.archiveFile })
    shouldRunAfter tasks.named('test')
    systemProperty 'parkpulse.war', layout.buildDirectory.file('libs/parkpulse.war').get().asFile.absolutePath
}

war {
    archiveFileName = 'parkpulse.war'
}
